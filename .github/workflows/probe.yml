name: Probe (dev)

# Manual helper for developing scrapers: prints what store pages contain.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs to fetch
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        env:
          URLS: ${{ inputs.urls }}
        run: node scripts/probe.mjs $URLS
